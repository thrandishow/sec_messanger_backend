name: shifr-svyaz
services:
  broker:
    image: shifr-svyaz-broker:0.1.0
    build:
      context: .
      dockerfile: broker/Dockerfile
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      BROKER_BIND: 0.0.0.0:7000
      BROKER_TOKEN: "${BROKER_TOKEN:-${IRC_PASSWORD:-}}"
    networks: [local]

  api:
    image: shifr-svyaz-api:0.1.0
    build: .
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8443
      BROKER_HOST: broker
      BROKER_PORT: 7000
      DATABASE_PATH: /app/data/shifr.sqlite
      TLS_CERT_PATH: /app/runtime/tls/server.crt
      TLS_KEY_PATH: /app/runtime/tls/server.key
      TRUST_PROXY: '1'
    volumes:
      - ./runtime/tls:/app/runtime/tls:ro
      - ./data:/app/data
    depends_on:
      broker:
        condition: service_healthy
    networks: [local]

  web:
    image: shifr-svyaz-web:0.1.0
    build:
      context: ../project_front
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    ports:
      - "${LAN_IP:?Run ./start.sh with your LAN IP}:8443:8443"
    volumes:
      - ./runtime/tls:/tls:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [local, lan]

networks:
  local:
    internal: true
  # A separate bridge is needed for replies to clients outside the Docker host.
  # Only the explicit LAN_IP:8443 binding is published.
  lan:
    driver: bridge
