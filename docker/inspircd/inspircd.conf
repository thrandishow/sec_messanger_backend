<server name="irc.shifr.local" description="Shifr Svyaz LAN" network="ShifrSvyaz" id="001">
<admin name="Local administrator" email="admin@localhost">

# Container-only listener. Compose deliberately publishes no IRC port.
<bind address="0.0.0.0" port="6667" type="clients">
<include file="/run/shifr/irc-connect.conf">

<limits nick="24" chan="50">
<options defaultmodes="nt" syntaxhints="no">
<security hidewhois="Local network" hideserver="irc.shifr.local">

<module name="cap">
<module name="ircv3">
<module name="ircv3_echomessage">
<module name="ircv3_servertime">

# No spanningtree, external services, DNSBL, ident, or message-history module.
